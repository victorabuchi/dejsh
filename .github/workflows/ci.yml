name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Syntax check
        run: bash -n dejsh && bash -n install.sh && bash -n tests/run.sh
      - name: Run tests
        run: bash tests/run.sh
      - name: Run tests under macOS system bash 3.2
        if: startsWith(matrix.os, 'macos')
        run: /bin/bash tests/run.sh
