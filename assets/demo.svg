<svg xmlns="http://www.w3.org/2000/svg" width="799" height="519" viewBox="0 0 799 519" role="img" aria-label="hindsh terminal demo: checkup and fix">
<rect width="799" height="519" rx="10" fill="#0d1117"/><rect width="799" height="36" rx="10" fill="#161b22"/><rect y="26" width="799" height="10" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<text x="399.5" y="23" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" text-anchor="middle">hindsh</text>
<text x="24" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#f0f6fc" font-weight="700">hindsh</tspan></text>
<text x="24" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">  HINDSH CHECKUP</tspan><tspan fill="#c9d1d9"> — 4,210 commands in ~/.zsh_history</tspan></text>
<text x="24" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  ✂  </tspan><tspan fill="#c9d1d9" font-weight="700">ALIASES  </tspan><tspan fill="#3fb950">47 repeated commands</tspan><tspan fill="#c9d1d9"> could be aliases (~7,224 keystrokes)</tspan><tspan fill="#58a6ff">   → hindsh alias</tspan></text>
<text x="24" y="167" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  ✎  </tspan><tspan fill="#c9d1d9" font-weight="700">TYPOS    </tspan><tspan fill="#d29922">1 recurring typo</tspan><tspan fill="#c9d1d9"></tspan><tspan fill="#58a6ff">   → hindsh typos</tspan></text>
<text x="24" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  !  </tspan><tspan fill="#c9d1d9" font-weight="700">SECRETS  </tspan><tspan fill="#f85149">4 possible secrets</tspan><tspan fill="#c9d1d9"> in plaintext!</tspan><tspan fill="#58a6ff">   → hindsh leaks</tspan></text>
<text x="24" y="209" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  ⛓  </tspan><tspan fill="#c9d1d9" font-weight="700">FLOWS    </tspan><tspan fill="#d29922">13 workflows</tspan><tspan fill="#c9d1d9"> you repeat could be one command</tspan><tspan fill="#58a6ff">   → hindsh flows</tspan></text>
<text x="24" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  ☢  </tspan><tspan fill="#c9d1d9" font-weight="700">DANGER   </tspan><tspan fill="#d29922">2 risky patterns</tspan><tspan fill="#c9d1d9"> in your history</tspan><tspan fill="#58a6ff">   → hindsh danger</tspan></text>
<text x="24" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  ›  </tspan><tspan fill="#c9d1d9" font-weight="700">MEMORY   </tspan><tspan fill="#3fb950">recording</tspan><tspan fill="#c9d1d9"> (86 commands: cwd, exit code, time)</tspan><tspan fill="#58a6ff">   → hindsh fix · resume</tspan></text>
<text x="24" y="293" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#f0f6fc" font-weight="700">npm start</tspan></text>
<text x="24" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f85149">  sh: vite: command not found</tspan></text>
<text x="24" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">$ </tspan><tspan fill="#f0f6fc" font-weight="700">hindsh fix</tspan></text>
<text x="24" y="398" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f0f6fc" font-weight="700">  last failure</tspan><tspan fill="#8b949e"> (2 min ago, in ~/projects/shopify)</tspan></text>
<text x="24" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#f85149">    ✗ npm start</tspan><tspan fill="#8b949e">  (exit code 1)</tspan></text>
<text x="24" y="461" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#c9d1d9">  Last time `npm start` failed, you ran:</tspan></text>
<text x="24" y="482" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" xml:space="preserve"><tspan fill="#3fb950" font-weight="700">    npm install</tspan><tspan fill="#8b949e">   (worked 5 of 5 times)</tspan></text>
</svg>